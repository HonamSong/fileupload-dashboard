services:
  dashboard:
    build: .
    image: filemanage-dashboard:latest
    container_name: filemanage-dashboard
    environment:
      LISTEN_ADDR: ":8180"
      DATA_DIR: "/data"
      # Public URL shown in the curl commands (change to your domain).
      PUBLIC_BASE_URL: "https://filemanage.dev.dsrv.com"
      TRASH_TTL_DAYS: "10"
      MAX_UPLOAD_MB: "1024"
      PREVIEW_LIMIT_KB: "1024"
      # 최초 1회만 사용되는 owner 비밀번호. 비워두면(권장) 랜덤 생성되어 기동 로그에 1회만
      # 출력됩니다. 첫 로그인 후 반드시 변경하세요. 고정 값을 쓰려면 8자 이상 강한 값으로.
      ADMIN_PASSWORD: ""
      # 신뢰 프록시 대역(IP/CIDR, 쉼표 구분). 이 목록의 peer에서 온 X-Forwarded-For 만 신뢰.
      # 미설정(권장) 시 포워디드 헤더를 무시하고 TCP 접속 IP를 사용합니다(헤더 위조 방지).
      #
      # 주의: 사설망 전체(10/8, 172.16/12, 192.168/16)를 넣지 마세요. 그 대역의 아무 호스트나
      # (또는 도커 브리지로 보이는 외부 접속이) X-Forwarded-For 를 위조해 IP 허용/차단·감사
      # 로그를 우회할 수 있습니다. 리버스 프록시 뒤라면 그 프록시의 실제 IP 하나(/32)만 넣으세요.
      #   예) TRUSTED_PROXIES: "10.20.30.40/32"
      TRUSTED_PROXIES: ""
      #IP_GUARD_DISABLE: "1"
    volumes:
      - ./data:/data
    ports:
      # 기본은 루프백에만 바인딩: 리버스 프록시를 앞에 두고 프록시만 이 포트로 접근하게 하세요.
      # 모든 인터페이스에 직접 노출하려면 "8180:8180" 으로 바꾸되, 그러면 TRUSTED_PROXIES 를
      # 설정한 경우 헤더 위조 위험이 커집니다.
      - "127.0.0.1:8180:8180"
    restart: unless-stopped
